name: collect

# Runs in GitHub's cloud every hour, so data keeps flowing with your PC off.
# Each run commits new data to this repo. Missed days are caught up on the next run.
on:
  schedule:
    - cron: "17,47 * * * *"   # twice an hour: GitHub often skips scheduled slots, and the tracker handles any cadence
  workflow_dispatch:
    inputs:
      task:
        description: "run, probe, report, youtube or thumbs"
        default: run
        required: true

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (thumbnail tracker)
        run: pip install --quiet pillow || echo "Pillow install failed; the thumbnail step will skip itself"

      - name: Run tracker
        timeout-minutes: 24   # the tracker stops itself at 18 min; this guarantees the save step below still runs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TASK: ${{ github.event.inputs.task || 'run' }}
        run: |
          case "$TASK" in run|probe|report|youtube|thumbs) ;; *) echo "unknown task: $TASK"; exit 2 ;; esac
          python -m tracker "$TASK"

      - name: Save data
        if: always()
        run: |
          git config user.name "trend-tracker-bot"
          git config user.email "trend-tracker-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed after 5 tries" && exit 1

  # Rebuild the dashboard from the freshly saved data and publish it with GitHub Pages.
  # Not committed to the repo, so it never bloats history. If Pages isn't enabled yet, this job fails on its own
  # and data collection is unaffected.
  dashboard:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dashboard
        run: python -m tracker dashboard site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
